<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Firstname</th>
                <th>Lastname</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
            {{ range $index, $user := .users }}
            <tr>
                <td>{{ $index }}</td>
                <td>{{ $user.Firstname }}</td>
                <td>{{ $user.Lastname }}</td>
                <td>{{ $user.Email }}</td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</body>
</html>
