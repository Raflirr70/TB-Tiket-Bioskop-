{{ template "base" . }}
{{ define "rooms-content" }}
<main class="rooms-page">
    <div class="rooms-header">
        <div>
            <h1>Kelola Rooms & Seats</h1>
            <p>Kelola ruangan dan kursi bioskop.</p>
        </div>
        <button type="button" class="btn-rooms-add" id="add-room-btn">
            <i class="uil uil-plus"></i> Tambah Ruangan
        </button>
    </div>

    <!-- GRID RUANGAN -->
    <div id="rooms-grid" class="rooms-grid">
        <p>Memuat ruangan...</p>
    </div>

    <!-- FORM TAMBAH RUANGAN -->
    <section class="room-form-section" id="room-form-section" hidden>
        <div class="room-form-card">
            <div class="room-form-head">
                <h2 id="room-form-title">Tambah Ruangan</h2>
                <button type="button" class="room-form-close" id="room-form-close">&times;</button>
            </div>

            <div class="room-form-body">
                <div class="room-field">
                    <label for="room-name">Nama Ruangan</label>
                    <input type="text" id="room-name" placeholder="contoh: Studio 4">
                    <p class="room-error" id="room-name-error" hidden>Nama ruangan wajib diisi.</p>
                </div>

                <div class="room-field">
                    <label for="room-status">Status</label>
                    <select id="room-status">
                        <option value="ready">Ready</option>
                        <option value="not ready">Not Ready</option>
                    </select>
                </div>

                <div class="room-seats-head">
                    <h3>Baris Kursi</h3>
                    <button type="button" class="btn-seats-add" id="seats-add-btn">
                        <i class="uil uil-plus"></i> Tambah Baris
                    </button>
                </div>

                <div id="seats-rows" class="seats-rows"></div>
            </div>

            <div class="room-form-actions">
                <button type="button" class="btn-ghost" id="room-form-cancel">Batal</button>
                <button type="button" class="btn-primary" id="room-form-save">Simpan</button>
            </div>
        </div>
    </section>

    <!-- VERIFIKASI SEBELUM SIMPAN (POPUP) -->
    <div class="room-modal-overlay" id="room-verify-modal" hidden>
        <div class="room-verify-card">
            <div class="room-form-head">
                <h2>Konfirmasi Ruangan Baru</h2>
                <button type="button" class="room-form-close" id="verify-close-modal">&times;</button>
            </div>

            <table class="room-verify-table">
                <tr>
                    <td>Nama</td>
                    <td id="verify-name">-</td>
                </tr>
                <tr>
                    <td>Baris</td>
                    <td id="verify-rows">-</td>
                </tr>
                <tr>
                    <td>Total Kursi</td>
                    <td id="verify-total">-</td>
                </tr>
                <tr>
                    <td>Status</td>
                    <td id="verify-status">ready</td>
                </tr>
            </table>

            <div class="room-form-actions">
                <button type="button" class="btn-ghost" id="verify-cancel">Batal</button>
                <button type="button" class="btn-primary" id="verify-confirm">Konfirmasi</button>
            </div>
        </div>
    </div>
</main>
{{ end }}
