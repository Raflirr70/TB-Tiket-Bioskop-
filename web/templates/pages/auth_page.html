{{ define "auth" }}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4/css/line.min.css">
</head>
<body class="auth-body">
    <a href="/" class="auth-back">
        <i class="uil uil-arrow-left"></i>
        <span>Kembali</span>
    </a>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <h1>BOOCIN<span>S</span></h1>
                <p>Booking Cinema Seats</p>
            </div>

            <div class="auth-tabs" id="auth-tabs">
                <button class="auth-tab {{ if eq .mode "login" }}active{{ end }}" data-mode="login">Login</button>
                <button class="auth-tab {{ if eq .mode "register" }}active{{ end }}" data-mode="register">Register</button>
            </div>

            <div class="auth-panels">
                <form id="login-form" class="auth-panel {{ if eq .mode "login" }}active{{ end }}" method="post">
                    <div class="auth-field">
                        <label for="login-email">Email</label>
                        <div class="auth-input">
                            <i class="uil uil-envelope"></i>
                            <input type="text" name="email" id="login-email" placeholder="Masukan Email" autocomplete="email">
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="login-password">Password</label>
                        <div class="auth-input">
                            <i class="uil uil-lock-alt"></i>
                            <input type="password" name="password" id="login-password" placeholder="Masukan Password" autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="auth-submit">Login Now</button>
                </form>

                <form id="register-form" class="auth-panel {{ if eq .mode "register" }}active{{ end }}" method="post">
                    <div class="auth-field">
                        <label for="reg-email">Email</label>
                        <div class="auth-input">
                            <i class="uil uil-envelope"></i>
                            <input type="text" name="email" id="reg-email" placeholder="Masukan Email" autocomplete="email">
                        </div>
                    </div>
                    <div class="auth-row">
                        <div class="auth-field">
                            <label for="reg-firstname">Firstname</label>
                            <div class="auth-input">
                                <i class="uil uil-user"></i>
                                <input type="text" name="firstname" id="reg-firstname" placeholder="Nama depan">
                            </div>
                        </div>
                        <div class="auth-field">
                            <label for="reg-lastname">Lastname</label>
                            <div class="auth-input">
                                <i class="uil uil-user"></i>
                                <input type="text" name="lastname" id="reg-lastname" placeholder="Nama belakang">
                            </div>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="reg-password">Password</label>
                        <div class="auth-input">
                            <i class="uil uil-lock-alt"></i>
                            <input type="password" name="password" id="reg-password" placeholder="Password">
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="reg-confirm">Konfirmasi Password</label>
                        <div class="auth-input">
                            <i class="uil uil-lock-alt"></i>
                            <input type="password" name="confirm_password" id="reg-confirm" placeholder="Ulangi password">
                        </div>
                    </div>
                    <button type="submit" class="auth-submit">Register Now</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth_page.js"></script>
</body>
</html>
{{ end }}
